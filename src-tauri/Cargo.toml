[package]
name = "visualstream"
version = "0.1.0"
description = "VisualStream inference replay workbench"
edition = "2021"
rust-version = "1.90"

[lib]
name = "visualstream_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
